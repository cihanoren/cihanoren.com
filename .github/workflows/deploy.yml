name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync code to app directory
        run: |
          rsync -av --exclude='.env' --exclude='.git' ./ /home/cihan/apps/cihanoren.com/

      - name: Rebuild and restart container
        run: |
          cd /home/cihan/server
          docker compose up -d --build cihanoren-app

      - name: Run migrations
        run: |
          docker exec cihanoren-app php artisan migrate --force

      - name: Cache config
        run: |
          docker exec cihanoren-app php artisan config:cache
          docker exec cihanoren-app php artisan route:cache
          docker exec cihanoren-app php artisan view:cache
